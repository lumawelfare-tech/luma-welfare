[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://luma-welfare.vercel.app"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ──────────────────────────────────────────────
# Edge Functions
# ──────────────────────────────────────────────

# Auth functions — use Supabase Auth directly, no custom JWT verification needed
[functions.auth-register]
verify_jwt = false

[functions.auth-login]
verify_jwt = false

[functions.auth-me]
verify_jwt = true

# Public data — no auth needed
[functions.public-data]
verify_jwt = false

# Member functions — require user JWT
[functions.member-dashboard]
verify_jwt = true

[functions.member-profile]
verify_jwt = true

[functions.member-family]
verify_jwt = true

[functions.member-subscriptions]
verify_jwt = true

[functions.member-contributions]
verify_jwt = true

# Admin functions — require user JWT (admin check done inside the function)
[functions.admin-dashboard]
verify_jwt = true

[functions.admin-members]
verify_jwt = true

[functions.admin-subscriptions]
verify_jwt = true

[functions.admin-contributions]
verify_jwt = true

[functions.admin-claims]
verify_jwt = true

[functions.admin-packages]
verify_jwt = true

[functions.admin-settings]
verify_jwt = true

# Payment functions
[functions.payments-initiate]
verify_jwt = true

[functions.payments-list]
verify_jwt = true

# Payment callback — called by M-Pesa Daraja API (no user JWT)
[functions.payments-callback]
verify_jwt = false
