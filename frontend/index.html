<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Content Security Policy is set via Vercel headers (frontend/vercel.json).
         No inline scripts: production script-src is 'self' only. -->
    <title>Luma Welfare — Community Welfare Platform in Kenya</title>
    <meta name="description" content="Luma Welfare is a community welfare organization in Kenya. Members contribute monthly to support each other through key life events — hospital costs, education, business, building, and more." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://luma-welfare.vercel.app/" />
    <link rel="icon" type="image/jpeg" href="/brand/luma-icon.jpeg" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6D9B3A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Luma Welfare" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Luma Welfare — Community Welfare Platform in Kenya" />
    <meta property="og:description" content="Members contribute monthly to support each other through key life events. Affordable welfare packages with transparent tracking." />
    <meta property="og:url" content="https://luma-welfare.vercel.app/" />
    <meta property="og:site_name" content="Luma Welfare" />
    <meta property="og:image" content="https://luma-welfare.vercel.app/brand/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:image:alt" content="Luma Welfare — Community welfare in Kenya" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://luma-welfare.vercel.app/brand/og-default.png" />
    <meta name="twitter:image:alt" content="Luma Welfare — Community welfare in Kenya" />
    <meta name="twitter:title" content="Luma Welfare — Community Welfare Platform in Kenya" />
    <meta name="twitter:description" content="Members contribute monthly to support each other through key life events. Affordable welfare packages with transparent tracking." />
    <style>
      .app-boot-static{display:flex;min-height:100dvh;width:100%;max-width:100vw;flex-direction:column;align-items:center;justify-content:center;background:#f7f8f6;padding:1.5rem;box-sizing:border-box;font-family:system-ui,sans-serif}
      .app-boot-static__ring{display:flex;height:7rem;width:7rem;align-items:center;justify-content:center;border-radius:9999px;border:3px solid #d6f0e3;border-top-color:#1d7a58}
      .app-boot-static__mark{display:flex;height:3.5rem;width:3.5rem;align-items:center;justify-content:center;border-radius:1rem;background:#006b2e;color:#fff;font-size:1.125rem;font-weight:700;letter-spacing:-.02em}
      .app-boot-static__wordmark{margin:2rem 0 0;color:#054a1f;font-size:1.25rem;font-weight:700;letter-spacing:-.02em;text-align:center}
      .app-boot-static__tag{margin:.25rem 0 0;color:#1d7a58;font-size:.625rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;text-align:center}
      .app-boot-static .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
      @media (prefers-reduced-motion:no-preference){.app-boot-static__ring{animation:app-boot-spin 1.15s linear infinite}}
      @keyframes app-boot-spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant paint before React hydrates; replaced on mount. No scripts. -->
      <div class="app-boot-static" role="status" aria-busy="true" aria-live="polite">
        <span class="sr-only">Loading Luma Welfare</span>
        <div class="app-boot-static__ring" aria-hidden="true">
          <div class="app-boot-static__mark">LW</div>
        </div>
        <p class="app-boot-static__wordmark">Luma Welfare</p>
        <p class="app-boot-static__tag">Community Welfare</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
