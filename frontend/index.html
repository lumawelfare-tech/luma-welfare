<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy
         CSP headers are configured at the Vercel/CDN layer (vercel.json or dashboard).
         The meta tag is removed because it conflicts with Vite's hashed script chunks
         and prevents React from mounting in production builds.
    -->
    <title>Luma Welfare — Community Welfare Platform in Kenya</title>
    <meta name="description" content="Luma Welfare is a community welfare organization in Kenya. Members contribute monthly to support each other through key life events — hospital costs, education, business, building, and more." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://luma-welfare.vercel.app/" />
    <link rel="icon" type="image/jpeg" href="/brand/luma-icon.jpeg" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6D9B3A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Luma Welfare" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Luma Welfare — Community Welfare Platform in Kenya" />
    <meta property="og:description" content="Members contribute monthly to support each other through key life events. Affordable welfare packages with transparent tracking." />
    <meta property="og:url" content="https://luma-welfare.vercel.app/" />
    <meta property="og:site_name" content="Luma Welfare" />
    <meta property="og:image" content="https://luma-welfare.vercel.app/brand/luma-logo.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://luma-welfare.vercel.app/brand/luma-logo.jpeg" />
    <meta name="twitter:title" content="Luma Welfare — Community Welfare Platform in Kenya" />
    <meta name="twitter:description" content="Members contribute monthly to support each other through key life events. Affordable welfare packages with transparent tracking." />
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Luma Welfare",
      "url": "https://luma-welfare.vercel.app",
      "logo": "https://luma-welfare.vercel.app/brand/luma-logo.jpeg",
      "description": "Community welfare organization in Kenya. Members contribute monthly to support each other through key life events.",
      "foundingDate": "2026",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "KE"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Kenya"
      },
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
