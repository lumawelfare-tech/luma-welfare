# Luma Welfare — Manual Edge Function Deployment (emergency override)
#
# Normal deploys run from CI on push to main after typecheck, lint, and tests.
# Manual fallback without a fresh push: Actions → CI → Run workflow (on main).
#
# This workflow remains as an emergency override that does not wait on CI.
# Prefer the gated CI job unless you explicitly need to redeploy without checks.
#
# Required secrets (set in repo Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN — Personal access token from Supabase dashboard
#                          (https://supabase.com/dashboard/account/tokens)

name: Deploy Edge Functions

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Function to deploy (leave empty for all)'
        required: false
        type: string

# Manual deploy needs contents read + secrets via environment.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: mkbxigxmhqdhxmptanqr
          FUNCTION_NAME: ${{ inputs.function_name }}
        run: |
          FN="$FUNCTION_NAME"
          if [ -n "$FN" ]; then
            if ! printf '%s' "$FN" | grep -Eq '^[a-z0-9-]{1,64}$'; then
              echo "Invalid function name"
              exit 1
            fi
            echo "Deploying: $FN"
            # Match scripts/deploy-edge-functions.sh JWT allowlist
            case "$FN" in
              auth-register|auth-verify-email|auth-login|auth-forgot-password|public-data|contact|payments-callback|send-report-email|admin-exports-worker|health)
                supabase functions deploy "$FN" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
                ;;
              *)
                supabase functions deploy "$FN" --project-ref "$SUPABASE_PROJECT_REF"
                ;;
            esac
          else
            echo "Deploying all functions..."
            npm run deploy:functions
          fi

      - name: Verify deployment
        run: npm run verify:deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
