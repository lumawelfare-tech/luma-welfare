# Luma Welfare — CI Pipeline
# Runs on every push and pull request to catch issues before deployment.
#
# Jobs:
# 1. security-audit — npm audit for dependency vulnerabilities
# 2. typecheck — TypeScript type checking
# 3. lint — Code linting
# 4. test — Unit and integration tests
# 5. build — Production build verification
# 6. edge-function-check — Verify all Edge Functions are deployed
# 7. deploy-verify — Post-deploy verification (manual trigger)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ============================================================================
  # SECURITY AUDIT
  # ============================================================================
  security-audit:
    name: "🔒 Security Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (root)
        run: |
          echo "=== Root workspace audit ==="
          npm audit --omit=dev 2>&1 | tee audit-root.txt
          echo ""

      - name: Run npm audit (frontend)
        working-directory: frontend
        run: |
          echo "=== Frontend audit ==="
          npm audit --omit=dev 2>&1 | tee ../audit-frontend.txt
          echo ""

      - name: Run npm audit (full — including dev)
        run: |
          echo "=== Full audit (including dev dependencies) ==="
          npm audit 2>&1 | tee audit-full.txt
          echo ""

      - name: Evaluate audit results
        run: |
          echo "============================================="
          echo "  SECURITY AUDIT RESULTS"
          echo "============================================="
          echo ""

          # Check for critical/high vulnerabilities
          CRITICAL=$(grep -c "critical" audit-full.txt 2>/dev/null || echo "0")
          HIGH=$(grep -c "high" audit-full.txt 2>/dev/null || echo "0")

          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          echo ""

          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ CRITICAL vulnerabilities found!"
            echo "Review audit-full.txt for details."
            echo ""
            cat audit-full.txt
            exit 1
          fi

          if [ "$HIGH" -gt 0 ]; then
            echo "⚠️  HIGH vulnerabilities found."
            echo "Review audit-full.txt for details."
            echo ""
            cat audit-full.txt
          fi

          echo "✅ No critical vulnerabilities found."
          echo ""

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            audit-root.txt
            audit-frontend.txt
            audit-full.txt
          retention-days: 30

  # ============================================================================
  # TYPECHECK
  # ============================================================================
  typecheck:
    name: "🔍 Typecheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (frontend)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: TypeScript check (backend)
        working-directory: backend
        run: npx tsc --noEmit 2>&1 || true
        # Backend may have Deno-specific imports that tsc can't resolve

  # ============================================================================
  # LINT
  # ============================================================================
  lint:
    name: "🧹 Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

  # ============================================================================
  # TESTS
  # ============================================================================
  test:
    name: "🧪 Tests"
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test -- --reporter=verbose

      - name: Run edge function integration tests
        run: |
          echo "=== Edge Function Integration Tests ==="
          echo "These tests verify live Edge Functions for auth/CORS/public endpoints."
          echo "Skipping in CI — requires live Supabase project."
          echo ""
          echo "To run locally:"
          echo "  npx vitest run scripts/__tests__/edge-functions.test.ts"
          echo ""

  # ============================================================================
  # BUILD
  # ============================================================================
  build:
    name: "🏗️ Build"
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la frontend/dist/
          echo ""
          echo "=== Bundle sizes ==="
          du -sh frontend/dist/assets/
          echo ""
          echo "✅ Build successful"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # E2E TESTS (Playwright — production smoke test)
  # ============================================================================
  e2e:
    name: "🎭 E2E Tests"
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test --reporter=list
        env:
          BASE_URL: https://luma-welfare.vercel.app

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ============================================================================
  # EDGE FUNCTION CHECK (prevents missing deployments)
  # ============================================================================
  edge-function-check:
    name: "📡 Edge Function Check"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Edge Functions exist locally
        run: |
          echo "=== Verifying Edge Functions exist locally ==="
          REQUIRED_FUNCTIONS=(
            "admin-dashboard"
            "admin-media"
            "admin-gallery"
            "admin-members"
            "admin-claims"
            "admin-contributions"
            "admin-subscriptions"
            "admin-packages"
            "admin-news"
            "admin-2fa"
            "admin-settings"
            "admin-reports"
            "admin-scheduled-reports"
            "admin-reconciliation"
            "admin-monitoring"
            "admin-exports"
            "auth-login"
            "auth-me"
            "auth-register"
            "member-dashboard"
            "member-profile"
            "public-data"
          )

          MISSING=0
          for fn in "${REQUIRED_FUNCTIONS[@]}"; do
            if [ ! -f "supabase/functions/${fn}/index.ts" ]; then
              echo "  ❌ MISSING: ${fn}/index.ts"
              MISSING=$((MISSING + 1))
            else
              echo "  ✓ ${fn}"
            fi
          done

          echo ""
          if [ $MISSING -gt 0 ]; then
            echo "❌ ${MISSING} required Edge Functions are missing!"
            exit 1
          fi

          echo "✅ All ${#REQUIRED_FUNCTIONS[@]} required Edge Functions exist."

      - name: Check migrations are numbered correctly
        run: |
          echo "=== Verifying migration file naming ==="
          MIGRATION_COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | grep -c "_")
          echo "Found ${MIGRATION_COUNT} migration files"

          # Check for APPLY_TO_STAGING.sql which should not be pushed
          if [ -f "supabase/migrations/APPLY_TO_STAGING.sql" ]; then
            echo "⚠️  APPLY_TO_STAGING.sql found — should not be committed"
          fi

          echo "✅ Migration files look correct."

  # ============================================================================
  # SECURITY SCORECARD (summary)
  # ============================================================================
  security-summary:
    name: "📊 Security Summary"
    runs-on: ubuntu-latest
    needs: [security-audit, typecheck, lint, test, build]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "============================================="
          echo "  CI PIPELINE SUMMARY"
          echo "============================================="
          echo ""
          echo "Security Audit:    ${{ needs.security-audit.result }}"
          echo "Typecheck:         ${{ needs.typecheck.result }}"
          echo "Lint:              ${{ needs.lint.result }}"
          echo "Tests:             ${{ needs.test.result }}"
          echo "Build:             ${{ needs.build.result }}"
          echo ""

          if [ "${{ needs.security-audit.result }}" = "failure" ]; then
            echo "❌ Security audit failed — deployment blocked"
            exit 1
          fi

          if [ "${{ needs.typecheck.result }}" = "failure" ]; then
            echo "❌ Typecheck failed — deployment blocked"
            exit 1
          fi

          if [ "${{ needs.lint.result }}" = "failure" ]; then
            echo "❌ Lint failed — deployment blocked"
            exit 1
          fi

          if [ "${{ needs.test.result }}" = "failure" ]; then
            echo "❌ Tests failed — deployment blocked"
            exit 1
          fi

          if [ "${{ needs.build.result }}" = "failure" ]; then
            echo "❌ Build failed — deployment blocked"
            exit 1
          fi

          echo "✅ All checks passed — safe to deploy"
