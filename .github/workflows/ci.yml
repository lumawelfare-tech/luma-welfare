# Luma Welfare — CI Pipeline
# Runs on every push and pull request to catch issues before deployment.
#
# Jobs:
# 1. security-audit — npm audit for dependency vulnerabilities
# 2. typecheck — TypeScript type checking
# 3. lint — Code linting
# 4. test — Unit and qualification tests
# 5. build — Production build (runs even if tests fail, as long as typecheck+lint pass)
# 6. edge-function-check — Verify Edge Function sources exist
# 7. e2e — Playwright smoke tests (requires a successful build)
# 8. security-summary — Always runs; aggregates upstream results

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least privilege — jobs that need more must declare it explicitly.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ============================================================================
  # LIVE SECRETS GATE (canonical repo only — forks stay soft)
  # ============================================================================
  live-secrets-gate:
    name: "🔐 Live Secrets Gate"
    runs-on: ubuntu-latest
    # Only enforce/notice on the production GitHub repo. Forks keep self-skip behavior.
    if: github.repository == 'lumawelfare-tech/luma-welfare'
    steps:
      - name: Check live verification secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
          E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
          # Set repo variable ENFORCE_LIVE_SECRETS=true after secrets are populated to hard-fail.
          ENFORCE: ${{ vars.ENFORCE_LIVE_SECRETS }}
        run: |
          set -euo pipefail
          MISSING=()
          [ -z "${SUPABASE_URL:-}" ] && MISSING+=("SUPABASE_URL")
          [ -z "${SUPABASE_ANON_KEY:-}" ] && MISSING+=("SUPABASE_ANON_KEY")
          [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && MISSING+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -z "${E2E_MEMBER_EMAIL:-}" ] && MISSING+=("E2E_MEMBER_EMAIL")
          [ -z "${E2E_MEMBER_PASSWORD:-}" ] && MISSING+=("E2E_MEMBER_PASSWORD")
          [ -z "${E2E_ADMIN_EMAIL:-}" ] && MISSING+=("E2E_ADMIN_EMAIL")
          [ -z "${E2E_ADMIN_PASSWORD:-}" ] && MISSING+=("E2E_ADMIN_PASSWORD")
          [ -z "${E2E_ADMIN_TOTP_SECRET:-}" ] && MISSING+=("E2E_ADMIN_TOTP_SECRET")

          if [ "${#MISSING[@]}" -eq 0 ]; then
            echo "✅ Live verification secrets are configured."
            exit 0
          fi

          echo "::warning::Missing secrets for live RLS/E2E: ${MISSING[*]}"
          echo "RLS and authenticated E2E will self-skip until these are set on a dedicated test project."
          echo "See docs/BRANCH_PROTECTION.md"
          echo ""

          if [ "${ENFORCE:-}" = "true" ]; then
            echo "::error::ENFORCE_LIVE_SECRETS=true — refusing green-via-skip on lumawelfare-tech/luma-welfare."
            exit 1
          fi

          echo "ℹ️ Soft mode: set repository variable ENFORCE_LIVE_SECRETS=true to fail CI when secrets are missing."

  # ============================================================================
  # SECURITY AUDIT
  # ============================================================================
  security-audit:
    name: "🔒 Security Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (root)
        run: |
          set -o pipefail
          echo "=== Root workspace audit ==="
          npm audit --omit=dev --audit-level=high 2>&1 | tee audit-root.txt
          echo ""

      - name: Run npm audit (frontend)
        working-directory: frontend
        run: |
          set -o pipefail
          echo "=== Frontend audit ==="
          npm audit --omit=dev --audit-level=high 2>&1 | tee ../audit-frontend.txt
          echo ""

      - name: Run npm audit (full — including dev)
        run: |
          echo "=== Full audit (including dev dependencies, informational) ==="
          npm audit 2>&1 | tee audit-full.txt || true
          echo ""

      - name: Evaluate audit results
        run: |
          echo "============================================="
          echo "  SECURITY AUDIT RESULTS"
          echo "============================================="
          echo ""

          # Prefer npm's machine-readable severity counts (avoid grep false positives).
          CRITICAL=$(npm audit --json --omit=dev 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);console.log(j.metadata?.vulnerabilities?.critical||0)}catch{console.log(0)}})")
          HIGH=$(npm audit --json --omit=dev 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);console.log(j.metadata?.vulnerabilities?.high||0)}catch{console.log(0)}})")

          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          echo ""

          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ CRITICAL vulnerabilities found!"
            echo "Review audit-full.txt for details."
            echo ""
            cat audit-full.txt
            exit 1
          fi

          if [ "$HIGH" -gt 0 ]; then
            echo "❌ HIGH vulnerabilities found!"
            echo "Review audit-full.txt for details."
            echo ""
            cat audit-full.txt
            exit 1
          fi

          echo "✅ No critical or high vulnerabilities found."
          echo ""

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: security-audit-reports
          path: |
            audit-root.txt
            audit-frontend.txt
            audit-full.txt
          retention-days: 30

  # ============================================================================
  # TYPECHECK
  # ============================================================================
  typecheck:
    name: "🔍 Typecheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (frontend)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Typecheck Edge Functions (Deno)
        run: |
          set -euo pipefail
          deno check --no-lock supabase/functions/shared/qualify.ts
          # All Edge Function entrypoints (skip non-index helpers)
          for f in supabase/functions/*/index.ts; do
            echo "Checking $f"
            deno check --no-lock "$f"
          done

  # ============================================================================
  # LINT
  # ============================================================================
  lint:
    name: "🧹 Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

  # ============================================================================
  # TESTS
  # ============================================================================
  test:
    name: "🧪 Tests"
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test -- --reporter=verbose

      - name: Unit test coverage (floor)
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vitest-coverage
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Run qualification engine tests
        run: npm run test:qualify
        env:
          # Date arithmetic in qualify.ts is UTC; pin TZ so CI matches everywhere.
          # (Previous failures: runner local TZ shifted eligibleFrom by one calendar day.)
          TZ: UTC

      - name: Run live RLS isolation
        run: npm run test:rls
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Suite self-skips when secrets are empty. When secrets ARE set, failures block the job.

      - name: Edge auth contract note
        run: |
          echo "=== Edge Function auth ==="
          echo "Unauthenticated auth checks run in Playwright e2e/security-api.spec.ts"
          echo "and live RLS (member JWT → admin-claims 401/403)."
          echo "Offline parsers: frontend vitest (validate / auth-validate)."
          echo ""

  # ============================================================================
  # BUILD — requires typecheck, lint, and tests to succeed
  # ============================================================================
  build:
    name: "🏗️ Build"
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Scan client bundle for leaked secrets
        run: npm run scan:bundle

      - name: Guard against legacy non-Supabase backend URLs
        run: npm run guard:backend

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la frontend/dist/
          echo ""
          echo "=== Bundle sizes ==="
          du -sh frontend/dist/assets/
          echo ""
          echo "✅ Build successful"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # E2E TESTS (Playwright — production smoke test + PR preview)
  # ============================================================================
  e2e:
    name: "🎭 E2E Tests"
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      always()
      && needs.build.result == 'success'
      && (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')))
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox --with-deps

      - name: Determine E2E target URL
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
            SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            echo "BASE_URL=https://luma-welfare-git-${SAFE_BRANCH}-lumawelfaretech.vercel.app" >> $GITHUB_ENV
            echo "E2E_TARGET=PR preview (branch: $BRANCH)"
          else
            echo "BASE_URL=https://luma-welfare.vercel.app" >> $GITHUB_ENV
            echo "E2E_TARGET=production"
          fi
          echo "Running E2E tests against: $BASE_URL"

      - name: Run E2E tests
        run: npx playwright test --reporter=list
        env:
          BASE_URL: ${{ env.BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
          E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  # ============================================================================
  # EDGE FUNCTION CHECK (prevents missing deployments)
  # ============================================================================
  edge-function-check:
    name: "📡 Edge Function Check"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check Edge Functions exist locally
        run: |
          echo "=== Verifying Edge Functions exist locally ==="
          REQUIRED_FUNCTIONS=(
            "admin-dashboard"
            "admin-media"
            "admin-gallery"
            "admin-members"
            "admin-claims"
            "admin-contributions"
            "admin-subscriptions"
            "admin-packages"
            "admin-news"
            "admin-2fa"
            "admin-settings"
            "admin-reports"
            "admin-scheduled-reports"
            "admin-reconciliation"
            "admin-monitoring"
            "admin-exports"
            "admin-complaints"
            "admin-community"
            "admin-documents"
            "admin-kb-ingest"
            "auth-login"
            "auth-forgot-password"
            "auth-me"
            "auth-register"
            "auth-verify-email"
            "member-dashboard"
            "member-profile"
            "member-identity-docs"
            "member-push-subscriptions"
            "member-claims"
            "member-complaints"
            "member-documents"
            "member-assistant"
            "public-data"
            "contact"
          )

          MISSING=0
          for fn in "${REQUIRED_FUNCTIONS[@]}"; do
            if [ ! -f "supabase/functions/${fn}/index.ts" ]; then
              echo "  ❌ MISSING: ${fn}/index.ts"
              MISSING=$((MISSING + 1))
            else
              echo "  ✓ ${fn}"
            fi
          done

          echo ""
          if [ $MISSING -gt 0 ]; then
            echo "❌ ${MISSING} required Edge Functions are missing!"
            exit 1
          fi

          echo "✅ All ${#REQUIRED_FUNCTIONS[@]} required Edge Functions exist."

      - name: Check migrations are numbered correctly
        run: |
          echo "=== Verifying migration file naming ==="
          MIGRATION_COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | grep -c "_")
          echo "Found ${MIGRATION_COUNT} migration files"

          # Check for APPLY_TO_STAGING.sql which should not be pushed
          if [ -f "supabase/migrations/APPLY_TO_STAGING.sql" ]; then
            echo "⚠️  APPLY_TO_STAGING.sql found — should not be committed"
          fi

          echo "✅ Migration files look correct."

  # ============================================================================
  # SECURITY SCORECARD (summary) — always runs; handles skipped/cancelled/missing
  # ============================================================================
  security-summary:
    name: "📊 Security Summary"
    runs-on: ubuntu-latest
    needs: [live-secrets-gate, security-audit, typecheck, lint, test, build, e2e, edge-function-check]
    if: always()
    steps:
      - name: Check all jobs
        env:
          LIVE_SECRETS: ${{ needs.live-secrets-gate.result }}
          SECURITY_AUDIT: ${{ needs.security-audit.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          EDGE_CHECK: ${{ needs.edge-function-check.result }}
        run: |
          echo "============================================="
          echo "  CI PIPELINE SUMMARY"
          echo "============================================="
          echo ""

          # Normalize empty/missing results (can happen if a needed job was cancelled early).
          LIVE_SECRETS="${LIVE_SECRETS:-missing}"
          SECURITY_AUDIT="${SECURITY_AUDIT:-missing}"
          TYPECHECK="${TYPECHECK:-missing}"
          LINT="${LINT:-missing}"
          TESTS="${TESTS:-missing}"
          BUILD="${BUILD:-missing}"
          E2E="${E2E:-missing}"
          EDGE_CHECK="${EDGE_CHECK:-missing}"

          echo "Live Secrets Gate: $LIVE_SECRETS"
          echo "Security Audit:    $SECURITY_AUDIT"
          echo "Typecheck:         $TYPECHECK"
          echo "Lint:              $LINT"
          echo "Tests:             $TESTS"
          echo "Build:             $BUILD"
          echo "E2E:               $E2E"
          echo "Edge Check:        $EDGE_CHECK"
          echo ""

          FAILED=0

          check_required() {
            local name="$1"
            local result="$2"
            case "$result" in
              success)
                echo "✅ $name"
                ;;
              failure)
                echo "❌ $name failed — deployment blocked"
                FAILED=1
                ;;
              cancelled)
                echo "❌ $name cancelled — deployment blocked"
                FAILED=1
                ;;
              skipped)
                # Live secrets gate skips on forks. E2E / Edge check now run on develop pushes too.
                # Tests/Build skip when typecheck (or other upstream) failed — expected, not a second root cause.
                if [ "$name" = "Live Secrets Gate" ] || [ "$name" = "E2E" ] || [ "$name" = "Edge Check" ]; then
                  echo "⚠️  $name skipped (expected on forks or some branch push events)"
                elif [ "$name" = "Build" ] || [ "$name" = "Tests" ]; then
                  if [ "$TYPECHECK" != "success" ] || [ "$LINT" != "success" ]; then
                    echo "⚠️  $name skipped (upstream typecheck/lint did not succeed)"
                  elif [ "$name" = "Build" ] && [ "$TESTS" != "success" ]; then
                    echo "⚠️  $name skipped (upstream tests did not succeed)"
                  else
                    echo "❌ $name skipped unexpectedly — deployment blocked"
                    FAILED=1
                  fi
                else
                  echo "❌ $name skipped unexpectedly — deployment blocked"
                  FAILED=1
                fi
                ;;
              *)
                echo "❌ $name result missing/unknown ($result) — deployment blocked"
                FAILED=1
                ;;
            esac
          }

          check_required "Live Secrets Gate" "$LIVE_SECRETS"
          check_required "Security Audit" "$SECURITY_AUDIT"
          check_required "Typecheck" "$TYPECHECK"
          check_required "Lint" "$LINT"
          check_required "Tests" "$TESTS"
          check_required "Build" "$BUILD"
          check_required "E2E" "$E2E"
          check_required "Edge Check" "$EDGE_CHECK"
          echo ""

          if [ "$FAILED" -ne 0 ]; then
            echo "❌ Pipeline blocked — fix failing jobs before deploy"
            exit 1
          fi

          echo "✅ All checks passed — safe to deploy"
