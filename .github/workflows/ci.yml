# Luma Welfare — CI Pipeline
# Runs on every push and pull request to catch issues before deployment.
#
# Jobs:
# 1. security-audit — npm audit for dependency vulnerabilities
# 2. typecheck — TypeScript type checking
# 3. lint — Code linting
# 4. test — Unit and qualification tests
# 5. build — Production build (runs even if tests fail, as long as typecheck+lint pass)
# 6. edge-function-check — Verify Edge Function sources exist
# 7. e2e — Playwright smoke tests (requires a successful build)
# 8. security-summary — Always runs; aggregates upstream results

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least privilege — jobs that need more must declare it explicitly.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ============================================================================
  # SECURITY AUDIT
  # ============================================================================
  security-audit:
    name: "🔒 Security Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (root)
        run: |
          echo "=== Root workspace audit ==="
          npm audit --omit=dev 2>&1 | tee audit-root.txt
          echo ""

      - name: Run npm audit (frontend)
        working-directory: frontend
        run: |
          echo "=== Frontend audit ==="
          npm audit --omit=dev 2>&1 | tee ../audit-frontend.txt
          echo ""

      - name: Run npm audit (full — including dev)
        run: |
          echo "=== Full audit (including dev dependencies) ==="
          npm audit 2>&1 | tee audit-full.txt
          echo ""

      - name: Evaluate audit results
        run: |
          echo "============================================="
          echo "  SECURITY AUDIT RESULTS"
          echo "============================================="
          echo ""

          # Prefer npm's machine-readable severity counts (avoid grep false positives).
          CRITICAL=$(npm audit --json --omit=dev 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);console.log(j.metadata?.vulnerabilities?.critical||0)}catch{console.log(0)}})")
          HIGH=$(npm audit --json --omit=dev 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);console.log(j.metadata?.vulnerabilities?.high||0)}catch{console.log(0)}})")

          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          echo ""

          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ CRITICAL vulnerabilities found!"
            echo "Review audit-full.txt for details."
            echo ""
            cat audit-full.txt
            exit 1
          fi

          if [ "$HIGH" -gt 0 ]; then
            echo "⚠️  HIGH vulnerabilities found."
            echo "Review audit-full.txt for details."
            echo ""
            cat audit-full.txt
          fi

          echo "✅ No critical vulnerabilities found."
          echo ""

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: security-audit-reports
          path: |
            audit-root.txt
            audit-frontend.txt
            audit-full.txt
          retention-days: 30

  # ============================================================================
  # TYPECHECK
  # ============================================================================
  typecheck:
    name: "🔍 Typecheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (frontend)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Typecheck Edge Functions (Deno)
        run: |
          # Pure shared module + migrated admin-subscriptions entrypoint
          deno check --no-lock supabase/functions/shared/qualify.ts
          deno check --no-lock supabase/functions/admin-subscriptions/index.ts

  # ============================================================================
  # LINT
  # ============================================================================
  lint:
    name: "🧹 Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

  # ============================================================================
  # TESTS
  # ============================================================================
  test:
    name: "🧪 Tests"
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test -- --reporter=verbose

      - name: Run qualification engine tests
        run: npm run test:qualify
        env:
          # Date arithmetic in qualify.ts is UTC; pin TZ so CI matches everywhere.
          # (Previous failures: runner local TZ shifted eligibleFrom by one calendar day.)
          TZ: UTC

      - name: Run edge function integration tests
        run: |
          echo "=== Edge Function Integration Tests ==="
          echo "These tests verify live Edge Functions for auth/CORS/public endpoints."
          echo "Skipping in CI — requires live Supabase project."
          echo ""
          echo "To run locally:"
          echo "  npx vitest run scripts/__tests__/edge-functions.test.ts"
          echo ""

  # ============================================================================
  # BUILD — does not block on test failures (still requires typecheck + lint)
  # ============================================================================
  build:
    name: "🏗️ Build"
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    if: always() && needs.typecheck.result == 'success' && needs.lint.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la frontend/dist/
          echo ""
          echo "=== Bundle sizes ==="
          du -sh frontend/dist/assets/
          echo ""
          echo "✅ Build successful"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # E2E TESTS (Playwright — production smoke test + PR preview)
  # ============================================================================
  e2e:
    name: "🎭 E2E Tests"
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      always()
      && needs.build.result == 'success'
      && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Determine E2E target URL
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
            SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            echo "BASE_URL=https://luma-welfare-git-${SAFE_BRANCH}-lumawelfaretech.vercel.app" >> $GITHUB_ENV
            echo "E2E_TARGET=PR preview (branch: $BRANCH)"
          else
            echo "BASE_URL=https://luma-welfare.vercel.app" >> $GITHUB_ENV
            echo "E2E_TARGET=production"
          fi
          echo "Running E2E tests against: $BASE_URL"

      - name: Run E2E tests
        run: npx playwright test --reporter=list
        env:
          BASE_URL: ${{ env.BASE_URL }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  # ============================================================================
  # EDGE FUNCTION CHECK (prevents missing deployments)
  # ============================================================================
  edge-function-check:
    name: "📡 Edge Function Check"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check Edge Functions exist locally
        run: |
          echo "=== Verifying Edge Functions exist locally ==="
          REQUIRED_FUNCTIONS=(
            "admin-dashboard"
            "admin-media"
            "admin-gallery"
            "admin-members"
            "admin-claims"
            "admin-contributions"
            "admin-subscriptions"
            "admin-packages"
            "admin-news"
            "admin-2fa"
            "admin-settings"
            "admin-reports"
            "admin-scheduled-reports"
            "admin-reconciliation"
            "admin-monitoring"
            "admin-exports"
            "auth-login"
            "auth-me"
            "auth-register"
            "auth-verify-email"
            "member-dashboard"
            "member-profile"
            "public-data"
          )

          MISSING=0
          for fn in "${REQUIRED_FUNCTIONS[@]}"; do
            if [ ! -f "supabase/functions/${fn}/index.ts" ]; then
              echo "  ❌ MISSING: ${fn}/index.ts"
              MISSING=$((MISSING + 1))
            else
              echo "  ✓ ${fn}"
            fi
          done

          echo ""
          if [ $MISSING -gt 0 ]; then
            echo "❌ ${MISSING} required Edge Functions are missing!"
            exit 1
          fi

          echo "✅ All ${#REQUIRED_FUNCTIONS[@]} required Edge Functions exist."

      - name: Check migrations are numbered correctly
        run: |
          echo "=== Verifying migration file naming ==="
          MIGRATION_COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | grep -c "_")
          echo "Found ${MIGRATION_COUNT} migration files"

          # Check for APPLY_TO_STAGING.sql which should not be pushed
          if [ -f "supabase/migrations/APPLY_TO_STAGING.sql" ]; then
            echo "⚠️  APPLY_TO_STAGING.sql found — should not be committed"
          fi

          echo "✅ Migration files look correct."

  # ============================================================================
  # SECURITY SCORECARD (summary) — always runs; handles skipped/cancelled/missing
  # ============================================================================
  security-summary:
    name: "📊 Security Summary"
    runs-on: ubuntu-latest
    needs: [security-audit, typecheck, lint, test, build]
    if: always()
    steps:
      - name: Check all jobs
        env:
          SECURITY_AUDIT: ${{ needs.security-audit.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "============================================="
          echo "  CI PIPELINE SUMMARY"
          echo "============================================="
          echo ""

          # Normalize empty/missing results (can happen if a needed job was cancelled early).
          SECURITY_AUDIT="${SECURITY_AUDIT:-missing}"
          TYPECHECK="${TYPECHECK:-missing}"
          LINT="${LINT:-missing}"
          TESTS="${TESTS:-missing}"
          BUILD="${BUILD:-missing}"

          echo "Security Audit:    $SECURITY_AUDIT"
          echo "Typecheck:         $TYPECHECK"
          echo "Lint:              $LINT"
          echo "Tests:             $TESTS"
          echo "Build:             $BUILD"
          echo ""

          FAILED=0

          check_required() {
            local name="$1"
            local result="$2"
            case "$result" in
              success)
                echo "✅ $name"
                ;;
              failure)
                echo "❌ $name failed — deployment blocked"
                FAILED=1
                ;;
              cancelled)
                echo "❌ $name cancelled — deployment blocked"
                FAILED=1
                ;;
              skipped)
                # Build is allowed to skip only when typecheck/lint already failed.
                if [ "$name" = "Build" ] && { [ "$TYPECHECK" != "success" ] || [ "$LINT" != "success" ]; }; then
                  echo "⚠️  $name skipped (typecheck/lint did not succeed)"
                else
                  echo "❌ $name skipped unexpectedly — deployment blocked"
                  FAILED=1
                fi
                ;;
              *)
                echo "❌ $name result missing/unknown ($result) — deployment blocked"
                FAILED=1
                ;;
            esac
          }

          check_required "Security Audit" "$SECURITY_AUDIT"
          check_required "Typecheck" "$TYPECHECK"
          check_required "Lint" "$LINT"
          check_required "Tests" "$TESTS"
          check_required "Build" "$BUILD"
          echo ""

          if [ "$FAILED" -ne 0 ]; then
            echo "❌ Pipeline blocked — fix failing jobs before deploy"
            exit 1
          fi

          echo "✅ All checks passed — safe to deploy"
